[project]
name = "mechatronikers"
version = "0.1.0"
description = "Blackforest Hackathon: SMART AUTOMATION"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "build123d>=0.13.0",
    # mcp 2.x is not supported by langchain-mcp-adapters yet
    "mcp>=1.10,<2",
    "numpy>=2.4.6",
    "pydantic>=2.14.1",
    "pypdfium2>=5.14.0",
    "scipy>=1.17.1",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
# Host-side agent only; never installed in the sandbox image (no cloud SDKs inside, docs/02).
agent = [
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=0.6",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
]
# Hub only: the central Postgres store (docs/13, D72). The sandbox image never talks to Postgres.
hub = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=0.6",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "reportlab>=5.0.1",
    "langgraph-checkpoint-sqlite>=3.0",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mechatronikers"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Code blocks in docs are illustrative sketches, not code to format.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"src/mechatronikers/session/gateway.py" = ["E501"]  # Caddyfile template lines stay unwrapped
"src/mechatronikers/agent/prompts.py" = ["E501"]  # prompt text lines are part of the prompt
"src/mechatronikers/testbench/review_package.py" = ["E501"]  # German document templates

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import shared fixtures from tests/fixtures
addopts = "-ra --cov=mechatronikers --cov-report=term-missing"
# A rare, not yet reproducible hang was seen twice under load; dump all stacks if it recurs.
faulthandler_timeout = 300

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# OpenCascade bindings and scipy ship without type information.
module = ["OCP.*", "scipy.*", "pypdfium2.*"]
ignore_missing_imports = true

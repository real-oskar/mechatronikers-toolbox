name: CI

# Manual only (2026-10-17): the private repo's Actions minutes are used up and will not be
# topped up, so nothing runs automatically. Merges are gated by a local build of the root
# Dockerfile (AGENTS.md). To restore, put back the triggers in the comment below.
# on:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # PRs test the newest Python only to save Actions minutes; main tests all supported versions.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.13"]') || fromJSON('["3.11", "3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # The raster path calls the tesseract binary (D85); without it those tests are skipped.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends tesseract-ocr
      - run: uv sync --locked
      # The faulty-model test is version-independent and slow: it runs once, in test-fixtures.
      - run: uv run pytest --ignore=tests/test_testbench_faulty.py

  # Tests that need real STEP files from Git LFS: the faulty Befestigung fixtures (#5), the golden
  # Fuss comparison and the agreement with human verdicts (#93). MT_REQUIRE_LFS makes them fail
  # instead of skip if a file is missing.
  test-fixtures:
    name: Test (LFS fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      # Only the LFS files these tests need, not the whole data/ folder.
      - run: >-
          git lfs pull
          --include="data/*/*.stp,tests/fixtures/step/**,tests/fixtures/human_verdicts/**"
      - run: uv sync --locked
      - run: >-
          uv run pytest --no-cov
          tests/test_testbench_faulty.py tests/test_golden.py tests/test_testbench_verdicts.py
        env:
          MT_REQUIRE_LFS: "1"

  # The central store on a real Postgres (#73): migrations, schema rules and the repository
  # contract. Elsewhere (locally, the judges' build) these tests skip without MT_PG_DSN.
  postgres:
    name: Test (Postgres store)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: docker.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: mt
          POSTGRES_PASSWORD: mt
          POSTGRES_DB: mt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mt -d mt"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
      - run: >-
          uv run pytest --no-cov tests/test_pgstore.py tests/test_pgstore_repositories.py
          tests/test_contract_events.py tests/test_contract_runs.py tests/test_contract_review.py
        env:
          MT_PG_DSN: postgresql://mt:mt@localhost:5432/mt

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Single aggregate job so branch protection only needs one required check.
  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, test, test-fixtures, postgres, frontend]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [[ "${{ needs.lint.result }}" == "success" && "${{ needs.test.result }}" == "success" && "${{ needs.test-fixtures.result }}" == "success" && "${{ needs.postgres.result }}" == "success" && "${{ needs.frontend.result }}" == "success" ]]
